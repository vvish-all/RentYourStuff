spring.application.name=appuser-service
server.port=8084


# Eureka Client Configuration
#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true
#eureka.client.service-url.default-zone=http://localhost:8761/eureka
# Eureka server URL

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/appuserdb
spring.datasource.username=postgres
spring.datasource.password=postgres

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate auto configuration for database schema management
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Show SQL queries in the console for debugging

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true
